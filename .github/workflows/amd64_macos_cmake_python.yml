# ref: https://github.com/actions/runner-images
name: amd64 MacOS CMake Python

on:
  push:
    branches:
      - main
      - v99bugfix
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
env:
  CCACHE_BASEDIR: ${{github.workspace}}
  CCACHE_DIR: ${{github.workspace}}/.ccache
  # Wheel version is 9.15.<OR_TOOLS_PATCH> (see set_version() in cmake/utils.cmake)
  OR_TOOLS_PATCH: 6756

jobs:
  native:
    strategy:
      matrix:
        cmake: [
          {name: "Make", generator: "Unix Makefiles", config: Release, build_target: all, test_target: test, install_target: install},
        ]
        python: [
          {version: "3.11"},
          {version: "3.12"},
          {version: "3.13"},
          {version: "3.14"},
          {version: "3.15"},
        ]
      fail-fast: false
    name: amd64•MacOS•CMake(${{matrix.cmake.name}})•Python-${{matrix.python.version}}
    runs-on: macos-15-intel
    env:
      deps_src_key: amd64_macos_python_deps_src
      deps_build_key: amd64_macos_python_deps_build_${{matrix.cmake.name}}
      ccache_key: amd64_macos_python_ccache_${{matrix.cmake.name}}
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        # can't use brew swig (4.5): it no longer defines PyInt_AsLong used by
        # ortools/base/python-swig.h, and 4.4 Director python support is broken on macos
        # see: https://github.com/swig/swig/issues/3279
        run: |
          brew install ccache
          curl -fsSL -o swig-4.3.1.tar.gz https://downloads.sourceforge.net/project/swig/swig/swig-4.3.1/swig-4.3.1.tar.gz && tar xzf swig-4.3.1.tar.gz && rm swig-4.3.1.tar.gz
          cd swig-4.3.1 && ./configure --prefix=$HOME/.local --without-pcre && make -j 4 && make install
          cd .. && rm -rf swig-4.3.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/swig -version
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{matrix.python.version}}
      - name: Update Path
        run: |
          echo "$HOME/Library/Python/${{matrix.python.version}}/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # RESTORING CACHES
      - name: Restore CMake dependency source code
        uses: actions/cache/restore@v5
        id: deps_src_restore
        with:
          key: ${{env.deps_src_key}}-${{hashFiles('CMakeLists.txt', 'cmake/**')}}
          path: ${{github.workspace}}/build/_deps/*-src
      - name: Restore CMake dependency build
        uses: actions/cache/restore@v5
        id: deps_build_restore
        with:
          key: ${{env.deps_build_key}}-${{hashFiles('CMakeLists.txt', 'cmake/**')}}
          path: |
            ${{github.workspace}}/build/_deps/*-build
            ${{github.workspace}}/build/_deps/*-subbuild
      - name: Restore CCache
        uses: actions/cache/restore@v5
        id: ccache_restore
        with:
          key: ${{env.ccache_key}}-${{github.sha}}
          restore-keys: ${{env.ccache_key}}-
          path: ${{env.CCACHE_DIR}}

      - name: Check CMake
        run: cmake --version
      - name: Configure
        run: >
          cmake -S. -Bbuild
          -G "${{matrix.cmake.generator}}"
          -DCMAKE_BUILD_TYPE=${{matrix.cmake.config}}
          -DBUILD_CXX_SAMPLES=OFF -DBUILD_CXX_EXAMPLES=OFF
          -DBUILD_PYTHON=ON
          -DCMAKE_INSTALL_PREFIX=install
      - name: Build
        run: >
          cmake --build build
          --config ${{matrix.cmake.config}}
          --target ${{matrix.cmake.build_target}}
          -v -j2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-amd64-macos-python${{matrix.python.version}}
          path: build/python/dist/*.whl
          if-no-files-found: error
      - name: Test
        # examples/contrib/check_dependencies.py imports pkg_resources (removed in setuptools 82).
        # virtualenv only seeds setuptools into the test venv for Python < 3.12, so only 3.11 fails it.
        run: >
          ctest --test-dir build
          -C ${{matrix.cmake.config}}
          --output-on-failure
          ${{ matrix.python.version == '3.11' && '-E python_contrib_check_dependencies' || '' }}
      - name: Install
        run: >
          cmake --build build
          --config ${{matrix.cmake.config}}
          --target ${{matrix.cmake.install_target}}
          -v
      - name: CCache stats
        run: |
          ccache --show-stats
          ccache --zero-stats

      # SAVING CACHES
      - name: Save CCache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          key: ${{steps.ccache_restore.outputs.cache-primary-key}}
          path: ${{env.CCACHE_DIR}}
      - name: Save CMake dependency build
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          key: ${{steps.deps_build_restore.outputs.cache-primary-key}}
          path: |
            ${{github.workspace}}/build/_deps/*-build
            ${{github.workspace}}/build/_deps/*-subbuild
      - name: Save CMake dependency source code
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          key: ${{steps.deps_src_restore.outputs.cache-primary-key}}
          path: ${{github.workspace}}/build/_deps/*-src

  amd64_macos_cmake_python:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v6
